name: Run automação + Build e Push da imagem 

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  chama-workflow-automacao:
    uses: JoseAugustoDosSantos/testes_automatizado_ci_cd/.github/workflows/run-automacao.yml@main

  docker-build:
    needs: ['chama-workflow-automacao']
    runs-on: ubuntu-latest
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/teste-automatizado-ci-cd:latest